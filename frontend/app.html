<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice-to-Map · Carte</title>
  <script>
    // Thème appliqué avant l'affichage, pour éviter un flash de la mauvaise couleur.
    var t = new URLSearchParams(location.search).get("theme");
    try { t = t || localStorage.getItem("vtm-theme"); } catch (e) {}
    document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app">
  <header class="app-header">
    <a class="brand" href="./" data-i18n-attr="aria-label:nav.back">
      <svg class="brand-mark" viewBox="0 0 40 28" aria-hidden="true">
        <rect x="1.5" y="1.5" width="37" height="25" rx="1" fill="none" stroke="currentColor" stroke-width="3"/>
        <path d="M8 14 h3 M13 9 v10 M17 6 v16 M21 10 v8 M25 7 v14 M29 11 v6 M32 14 h1" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/>
      </svg>
      <span>Voice-to-Map</span>
    </a>
    <div class="status">
      <span id="conn" class="dot off" data-i18n-attr="title:conn"></span>
      <span id="conn-label">Déconnecté</span>
      <span id="node" class="node">—</span>
    </div>
    <div class="prefs">
      <button type="button" class="icon-button flag" id="lang-toggle"></button>
      <button type="button" class="icon-button" id="theme-toggle"></button>
    </div>
    <a class="header-link" href="./" data-i18n="nav.home">Accueil</a>
  </header>
  <main class="layout">
    <div id="map" class="map"></div>
    <div id="alert-banner" class="alert-banner" role="alert" hidden>
      <div class="alert-text">
        <strong id="alert-title"></strong>
        <span id="alert-where"></span>
      </div>
      <div class="alert-actions">
        <button type="button" id="alert-go" class="alert-go"></button>
        <button type="button" id="alert-see"></button>
        <button type="button" id="alert-close" class="alert-close"></button>
      </div>
    </div>

    <aside class="panel">

      <section id="claim-view" class="identity" hidden>
        <label for="unit" class="label" data-i18n="claim.q">Quelle unité ce terminal gère-t-il ?</label>
        <div class="row">
          <input id="unit" name="unit" placeholder="ALPHA 1" autocomplete="off">
          <button type="button" id="claim" data-i18n="claim.take">Prendre</button>
        </div>
        <p id="claim-msg" class="msg" role="status"></p>
        <p id="taken" class="hint left"></p>
        <button type="button" id="pc-mode" class="link" data-i18n="claim.pc">Poste de commandement : voir sans unité</button>
      </section>

      <section id="me-view" class="identity me" hidden>
        <div>
          <span class="label" id="me-label">Ce terminal gère</span>
          <strong id="me" class="me-unit"></strong>
        </div>
        <div class="row">
          <button type="button" id="leave" class="link" data-i18n="me.take">Prendre une unité</button>
          <button type="button" id="release" class="link" data-i18n="me.leave">Quitter l'unité</button>
        </div>
      </section>

      <form id="report-form" class="report" hidden>
        <button type="button" id="ptt" class="ptt" data-i18n="ptt">Maintenir pour parler</button>
        <p class="hint" data-i18n="ptt.hint">ou maintenir la barre espace, hors des champs de saisie</p>
        <button type="button" id="sos" class="sos" data-i18n="sos">Demander du renfort</button>
        <button type="button" id="sos-clear" class="sos-clear" data-i18n="sos.clear" hidden>Situation sécurisée</button>
        <label for="text" data-i18n="text.label">Annonce écrite</label>
        <textarea id="text" name="text" rows="2" placeholder="Je suis au sud de l'église." data-i18n-attr="placeholder:text.placeholder" required></textarea>
        <button type="submit" id="send" data-i18n="send">Envoyer</button>
        <p id="form-msg" class="msg" role="status"></p>
      </form>

      <div class="samples" id="samples" hidden>
        <span class="label" data-i18n="samples">Exemples</span>
        <button type="button" class="sample" data-i18n="s1"></button>
        <button type="button" class="sample" data-i18n="s2"></button>
        <button type="button" class="sample" data-i18n="s3"></button>
        <button type="button" class="sample" data-i18n="s4"></button>
        <button type="button" class="sample" data-i18n="s5"></button>
        <button type="button" class="sample" data-i18n="s6"></button>
        <button type="button" class="sample" data-i18n="s7"></button>
        <button type="button" class="sample" data-i18n="s8"></button>
        <button type="button" class="sample" data-i18n="s9"></button>
      </div>

      <button type="button" id="sim" class="sim" hidden>Simulation ennemis : arrêtée</button>

      <div class="history-head">
        <h2 data-i18n="history">Historique</h2>
        <div class="history-actions">
          <button type="button" id="clear-history" data-i18n="clear" data-i18n-attr="title:clear.title">Effacer (local)</button>
          <button type="button" id="verify" data-i18n="verify">Vérifier l'intégrité</button>
        </div>
      </div>
      <p id="integrity" class="msg" role="status"></p>
      <ol id="events" class="events"></ol>
    </aside>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
